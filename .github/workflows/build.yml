name: C/C++ CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '.github/**'

  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows:
    name: 'Windows'
    runs-on: windows-latest

    env:
      solution: 'msvc/resemiclip.sln'
      buildPlatform: 'Win32'
      buildRelease: 'Release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildRelease }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:XPDeprecationWarning=false

      - name: Copy Binary files
        run: |
          mkdir publish\addons\resemiclip
          if (Test-Path "msvc\${{ env.buildRelease }}\resemiclip_mm.dll") {
            move msvc\${{ env.buildRelease }}\resemiclip_mm.dll publish\addons\resemiclip\resemiclip_mm.dll
          } else {
            move msvc\Release\resemiclip_mm.dll publish\addons\resemiclip\resemiclip_mm.dll
          }

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win32
          path: publish/*

  linux:
    name: 'Linux'
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.app-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 cmake make git rsync

      - name: Configure Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build using GCC Compiler
        run: |
          rm -rf build && CC=gcc CXX=g++ cmake -B build && cmake --build build -j$(nproc)

      - name: Reading appversion.h
        id: app-version
        run: |
          if [ -e "version/appversion.h" ]; then
            APP_VERSION=$(grep -wi '#define APP_VERSION' version/appversion.h | sed -e 's/#define APP_VERSION[ \t\r\n\v\f]\+\(.*\)/\1/i' -e 's/\r//g' -e 's/"//g')
          fi
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Prepare Config files
        run: |
          mkdir -p publish/addons/resemiclip
          if [ -d "dist" ]; then
            rsync -a dist/ publish/addons/resemiclip/
          fi

      - name: Copy Binary files
        run: |
          mv build/resemiclip_mm_i386.so publish/addons/resemiclip/resemiclip_mm_i386.so

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux32
          path: publish/*
